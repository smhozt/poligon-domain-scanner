name: JSON Temizleyici

on:
  workflow_dispatch: # Sadece elle tetikleme butonu koyar

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Temizliği Çalıştır
        run: python temizlik.py

      - name: Temizlenmiş JSON'ları GitHub'a Kaydet
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add *.json
          git diff --staged --quiet || git commit -m "🧹 JSON dosyaları temizlendi (Kendi domainlerimiz silindi)"
          git pull --rebase origin main || true
          git push
