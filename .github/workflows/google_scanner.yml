name: Google Search Scanner

on:
  schedule:
    - cron: '0 8 * * *'   # Her gun 08:00
    - cron: '0 14 * * *'  # Her gun 14:00
    - cron: '0 20 * * *'  # Her gun 20:00
  workflow_dispatch:

jobs:
  google-scan:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install aiohttp

      - name: Run Google Scanner
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
        run: python google_scanner.py
