name: Google Search Scanner

on:
  schedule:
    # Gunde 3 kez calisir (08:00, 14:00, 20:00 UTC)
    - cron: '0 8,14,20 * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  google-scan:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Google Scanner
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_CX: ${{ secrets.GOOGLE_CX }}
        run: python google_scanner.py

      # Amneziyi Çözen ve Dashboard'u Güncelleyen TEK ADIM:
      - name: Update Dashboard and Commit
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          
          # 1. Eğer Google yeni bir site bulup json oluşturduysa onu ekle
          if [ -f reported_google.json ]; then
            git add reported_google.json
          fi
          
          # 2. Dashboard'u güncelle (Python dosyasını çalıştırır)
          python update_dashboard.py
          
          # 3. Güncellenen Dashboard'u git'e ekle
          git add DASHBOARD.md
          
          # 4. Hepsini tek seferde paketle ve GitHub'a yolla
          git commit -m "update: google radar ve dashboard guncellendi [skip ci]" || echo "No changes to commit"
          git pull --rebase origin main
          git push
