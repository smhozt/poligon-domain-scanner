- name: Commit and Push
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          
          # 1. ÖNCE ELİMİZDEKİLERİ KAYDEDİYORUZ (ADD & COMMIT)
          git add -A
          git commit -m "update: sistem guncellendi [skip ci]" || echo "No changes"
          
          # 2. SONRA EĞER GITHUB'DA YENİ BİR ŞEY VARSA ÇEKİYORUZ (PULL)
          git pull --rebase origin main
          
          # 3. EN SON HEPSİNİ YUKARI FIRLATIYORUZ (PUSH)
          git push
