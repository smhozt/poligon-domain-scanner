name: Domain Scanner

on:
  schedule:
    - cron: '0 * * * *' # Her saat başı çalışır
  workflow_dispatch:

permissions:
  contents: write # Botun hafızayı repoya yazabilmesi için izin veriyoruz

jobs:
  scan:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install aiohttp

      - name: Run scanner
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
        run: python scanner.py

      # Amnezi Çözümü: Güncellenen reported.json dosyasını repoya kalıcı olarak kaydet
      - name: Commit and Push Memory (reported.json)
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add reported.json
          git commit -m "update: hafiza dosyasi guncellendi [skip ci]" || echo "No changes to commit"
          git push
