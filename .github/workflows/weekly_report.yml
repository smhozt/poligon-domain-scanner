name: Weekly Report

on:
  schedule:
    - cron: '0 8 * * 1'  # Her Pazartesi 08:00 Sofia saati
  workflow_dispatch:

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install aiohttp

      - name: Run Weekly Report
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
        run: python weekly_report.py

      - name: Commit weekly stats
        if: always()
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add weekly_stats.json || true
          git diff --staged --quiet || git commit -m "update: weekly_stats.json [skip ci]"
          git pull --rebase origin main
          git push
