name: Weekly Report

on:
  schedule:
    - cron: '0 8 * * 1'  # Her Pazartesi 08:00 Sofia saati
  workflow_dispatch:       # Manuel tetikleme

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install aiohttp

      - name: Restore all caches
        uses: actions/cache@v4
        with:
          path: |
            reported.json
            betsat_reported.json
            turkbet_reported.json
            google_reported.json
            whois_reported.json
            weekly_stats.json
          key: weekly-cache-${{ github.run_id }}
          restore-keys: |
            weekly-cache-
            whois-cache-
            reported-
            google-reported-

      - name: Run Weekly Report
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
        run: python weekly_report.py

      - name: Save stats cache
        uses: actions/cache@v4
        if: always()
        with:
          path: |
            reported.json
            betsat_reported.json
            turkbet_reported.json
            google_reported.json
            whois_reported.json
            weekly_stats.json
          key: weekly-cache-${{ github.run_id }}
