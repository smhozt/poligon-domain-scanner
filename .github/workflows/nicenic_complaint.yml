name: NiceNIC Complaint
on:
  schedule:
    - cron: '30 9 * * *'   # host workflow'undan 30 dk kaydırıldı, çakışmasın diye
    - cron: '30 21 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  complaint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install aiohttp
      - name: Run NiceNIC Complaint
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: python nicenic_complaint.py
      - name: Commit complaint state
        if: always()
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add complaint_reported.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "update: nicenic complaint state [skip ci]"
          git pull --rebase origin main
          git push
