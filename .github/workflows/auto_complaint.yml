name: Auto Complaint
on:
  schedule:
    - cron: '0 9 * * *'   # Gün içi çalışma
    - cron: '0 21 * * *'  # Akşam çalışma (~12 saat sonra)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  complaint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install aiohttp dnspython
      - name: Run Auto Complaint
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: python auto_complaint.py
      - name: Commit complaint state
        if: always()
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add complaint_reported.json host_complaint_reported.json unknown_clusters.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "update: complaint state [skip ci]"
          git pull --rebase origin main
          git push
