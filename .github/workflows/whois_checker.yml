name: WHOIS Checker

on:
  schedule:
    - cron: '30 */3 * * *'  # Her 3 saatte bir (scanner'dan 30 dk sonra)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  whois:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install aiohttp

      - name: Run WHOIS Checker
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
        run: python whois_checker.py

      - name: Commit WHOIS state
        if: always()
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add whois_reported.json || true
          git diff --staged --quiet || git commit -m "update: whois_reported.json [skip ci]"
          git pull --rebase origin main
          git push
