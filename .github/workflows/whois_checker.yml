name: WHOIS Checker

on:
  schedule:
    - cron: '30 */3 * * *'  # Her 3 saatte bir (scanner'dan 30 dk sonra)
  workflow_dispatch:

jobs:
  whois:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install aiohttp

      - name: Restore reported cache
        uses: actions/cache@v4
        with:
          path: |
            reported.json
            whois_reported.json
          key: whois-cache-${{ github.run_id }}
          restore-keys: |
            whois-cache-
            reported-

      - name: Run WHOIS Checker
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
        run: python whois_checker.py

      - name: Save cache
        uses: actions/cache@v4
        if: always()
        with:
          path: |
            reported.json
            whois_reported.json
          key: whois-cache-${{ github.run_id }}
