name: Safe Browsing Reporter

on:
  schedule:
    - cron: '0 */6 * * *'  # 6 saatte bir
  workflow_dispatch:

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install aiohttp

      - name: Run Safe Browsing Reporter
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
          SAFE_BROWSING_API_KEY: ${{ secrets.SAFE_BROWSING_API_KEY }}
        run: python safe_browsing_reporter.py

      - name: Commit safe browsing state
        if: always()
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add safe_browsing_reported.json || true
          git diff --staged --quiet || git commit -m "update: safe_browsing_reported.json [skip ci]"
          git pull --rebase origin main
          git push
